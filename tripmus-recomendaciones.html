<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B45">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <title>Tripmus - Recomendaciones</title>
  <style>
    :root {
      --color-fondo: #F7F3EC;
      --color-texto: #1E1B34;
      --color-texto-suave: #6b6880;
      --color-borde: #e6e0d4;
      --color-marca: #FF6B45;
      --color-acento-teal: #1FADA6;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--color-fondo);
      color: var(--color-texto);
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--color-borde);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-texto-suave);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .nav a.activo {
      background-color: var(--color-marca);
      color: white;
    }

    .logo-tripmus {
      display: flex;
      align-items: center;
      gap: 2px;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 22px;
      color: var(--color-texto);
      margin-bottom: 14px;
    }

    .logo-tripmus .punto {
      color: var(--color-marca);
      font-size: 26px;
      line-height: 0;
    }

    h1 {
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
    }

    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }

    p.subtitulo {
      color: var(--color-texto-suave);
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .fila-inputs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .fila-inputs input {
      padding: 10px 12px;
      border: 1px solid var(--color-borde);
      border-radius: 12px;
      font-size: 14px;
      background: white;
      flex: 1;
      min-width: 140px;
    }

    #generar {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--color-marca);
      color: white;
      border: none;
      border-radius: 12px;
      width: 100%;
      margin-bottom: 8px;
    }

    .aviso-simulado {
      font-size: 12px;
      color: var(--color-texto-suave);
      background: white;
      border: 1px dashed var(--color-borde);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 20px;
    }

    .tarjeta-destino {
      background: white;
      border: 1px solid var(--color-borde);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(30, 27, 52, 0.04);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .tarjeta-destino:hover {
      box-shadow: 0 4px 14px rgba(30, 27, 52, 0.08);
      transform: translateY(-1px);
    }

    .tarjeta-destino .cabecera {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .tarjeta-destino .nombre {
      font-weight: 600;
      font-size: 15px;
    }

    .tarjeta-destino .precio {
      font-size: 12px;
      color: var(--color-texto-suave);
    }

    .tarjeta-destino .descripcion {
      font-size: 13px;
      color: var(--color-texto-suave);
      margin: 0;
    }

    #resultado {
      display: none;
    }

    #cargando {
      display: none;
      font-size: 13px;
      color: var(--color-texto-suave);
      margin-bottom: 16px;
    }
    button {
      transition: transform 0.08s ease, opacity 0.08s ease;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div id="banner-instalar-pwa" style="display:none; position:fixed; bottom:0; left:0; right:0; background: var(--color-marca); color:white; padding:12px 16px; font-size:13px; text-align:center; z-index:1000; cursor:pointer; font-weight:600;"></div>

  <div class="logo-tripmus">Tripmus<span class="punto">.</span></div>
  <a class="volver" href="tripmus-viajes.html" style="display:inline-block; font-size:13px; color: var(--color-texto-suave); text-decoration:none; margin-bottom:16px;">&larr; Volver a viajes</a>

  <h1>Guía de destinos</h1>
  <p class="subtitulo">Ideas basadas en vuestra propia experiencia real de viaje, para inspiraros antes de decidir.</p>

  <div class="fila-inputs">
    <select id="temporada">
      <option value="invierno">Invierno (dic-feb)</option>
      <option value="primavera">Primavera (mar-may)</option>
      <option value="verano">Verano (jun-ago)</option>
      <option value="otono">Otoño (sep-nov)</option>
    </select>
    <input type="text" id="presupuesto-max" placeholder="Presupuesto máx (€), opcional">
  </div>

  <button id="generar">Buscar recomendaciones</button>

  <p class="aviso-simulado">
    Estas recomendaciones vienen de la guía que vosotros mismos vais construyendo con vuestra experiencia real.
    <a href="tripmus-anadir-destino.html">+ Añadir un destino nuevo</a>
  </p>

  <p id="cargando">Pensando en destinos...</p>

  <div id="resultado"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://jhowamfmrrhxphhijgsn.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impob3dhbWZtcnJoeHBoaGlqZ3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzI3ODcsImV4cCI6MjEwMzc0ODc4N30.EwJi9JrniY3SpQPSl-JtnnwSLxCzMIpMQHLN4P7PUhE";
    const cliente = supabase.createClient(supabaseUrl, supabaseKey);

    // ---------- FUNCIÓN QUE TRAE LAS RECOMENDACIONES ----------
    // Ya no es simulada: consulta de verdad la tabla "destinos" que vosotros
    // vais rellenando a mano en tripmus-anadir-destino.html.
    async function generarRecomendaciones(temporada, presupuestoMax) {
      let consulta = cliente
        .from("destinos")
        .select("nombre, precio_desde, descripcion, transporte, enlace_alojamiento")
        .eq("temporada", temporada)
        .order("precio_desde", { ascending: true });

      // Si se ha indicado un presupuesto máximo, filtramos también por precio.
      // "lte" significa "less than or equal" (menor o igual que).
      if (presupuestoMax !== "" && !isNaN(Number(presupuestoMax))) {
        consulta = consulta.lte("precio_desde", Number(presupuestoMax));
      }

      const resultado = await consulta;

      if (resultado.error) {
        console.error("Supabase error:", resultado.error.message);
        return [];
      }

      return resultado.data;
    }

    document.getElementById("generar").addEventListener("click", async function () {
      const temporada = document.getElementById("temporada").value;
      const presupuestoMax = document.getElementById("presupuesto-max").value.trim();

      document.getElementById("resultado").style.display = "none";
      document.getElementById("cargando").style.display = "block";

      const destinos = await generarRecomendaciones(temporada, presupuestoMax);

      document.getElementById("cargando").style.display = "none";
      const contenedor = document.getElementById("resultado");
      contenedor.style.display = "block";
      contenedor.innerHTML = "";

      if (destinos.length === 0) {
        contenedor.innerHTML = '<p style="font-size:14px; color: var(--color-texto-suave);">Todavía no hay destinos guardados para esta temporada. <a href="tripmus-anadir-destino.html">Añade el primero</a>.</p>';
        return;
      }

      destinos.forEach(function (d) {
        const tarjeta = document.createElement("div");
        tarjeta.classList.add("tarjeta-destino");
        tarjeta.innerHTML =
          '<div class="cabecera">' +
          '<span class="nombre">' + d.nombre + '</span>' +
          '<span class="precio">' + (d.precio_desde ? "desde " + d.precio_desde + "€" : "") + '</span>' +
          '</div>' +
          '<p class="descripcion">' + d.descripcion + '</p>' +
          (d.transporte ? '<p class="descripcion" style="margin-top:4px;"><strong>Cómo llegar:</strong> ' + d.transporte + '</p>' : '') +
          (d.enlace_alojamiento ? '<a href="' + d.enlace_alojamiento + '" target="_blank" rel="noopener sponsored" style="display:inline-block; margin-top:10px; font-size:12px; font-weight:600; color:white; background-color: var(--color-acento-teal); padding:8px 14px; border-radius:20px; text-decoration:none;">Ver alojamiento →</a>' : '');
        contenedor.appendChild(tarjeta);
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    }

    // ---------- INSTALACIÓN COMO APP ----------
    let promptInstalacionDiferido = null;

    function esIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    }

    function yaInstalada() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    function mostrarBannerInstalar(tipo) {
      if (yaInstalada()) return;
      const banner = document.getElementById('banner-instalar-pwa');
      if (!banner) return;

      if (tipo === 'android') {
        banner.textContent = '📲 Instalar Tripmus';
        banner.onclick = function () {
          if (promptInstalacionDiferido) {
            promptInstalacionDiferido.prompt();
            promptInstalacionDiferido.userChoice.then(function () {
              promptInstalacionDiferido = null;
              banner.style.display = 'none';
            });
          }
        };
      } else {
        banner.textContent = '📲 Para instalar: toca Compartir → Añadir a pantalla de inicio';
        banner.onclick = function () { banner.style.display = 'none'; };
      }

      banner.style.display = 'block';
    }

    // Chrome/Android dispara este evento cuando la web cumple los requisitos
    // para ser instalada. Lo interceptamos para mostrar NUESTRO botón en vez
    // del aviso genérico del navegador.
    window.addEventListener('beforeinstallprompt', function (evento) {
      evento.preventDefault();
      promptInstalacionDiferido = evento;
      mostrarBannerInstalar('android');
    });

    // iOS no tiene ese evento (Apple no lo permite), así que detectamos
    // el sistema operativo directamente y mostramos las instrucciones.
    if (esIOS() && !yaInstalada()) {
      mostrarBannerInstalar('ios');
    }
  </script>
</body>
</html>
