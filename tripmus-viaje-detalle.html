<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <title>Tripmus - Detalle del viaje</title>
  <style>
    :root {
      --color-fondo: #F7F3EC;
      --color-texto: #1E1B34;
      --color-texto-suave: #6b6880;
      --color-borde: #e6e0d4;
      --color-marca: #FF6B45;
      --color-acento-teal: #1FADA6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--color-fondo);
      color: var(--color-texto);
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .logo-tripmus {
      display: flex; align-items: center; gap: 2px;
      font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 22px; margin-bottom: 14px;
    }
    .logo-tripmus .punto { color: var(--color-marca); font-size: 26px; line-height: 0; }
    a.volver {
      display: inline-block;
      font-size: 13px;
      color: var(--color-texto-suave);
      text-decoration: none;
      margin-bottom: 16px;
    }
    h1 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 20px; margin-bottom: 2px; }
    p.subtitulo { color: var(--color-texto-suave); font-size: 14px; margin-top: 0; margin-bottom: 20px; }
    select, input {
      padding: 10px 12px;
      border: 1px solid var(--color-borde);
      border-radius: 12px;
      font-size: 14px;
      background: white;
      width: 100%;
    }
    .caja-anadir {
      background: white;
      border: 1px solid var(--color-borde);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .caja-anadir > * { margin-bottom: 10px; }
    button {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--color-marca);
      color: white;
      border: none;
      border-radius: 12px;
      width: 100%;
      transition: transform 0.08s ease;
    }
    button:active { transform: scale(0.98); }
    #mensaje-estado { font-size: 13px; color: var(--color-texto-suave); margin: 4px 0 24px; }

    h2.grupo-tipo {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-texto-suave);
      margin: 20px 0 8px;
    }

    .tarjeta-enlace {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid var(--color-borde);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .tarjeta-enlace .info { min-width: 0; }
    .tarjeta-enlace .titulo { font-weight: 600; font-size: 14px; }
    .tarjeta-enlace .quien { font-size: 12px; color: var(--color-texto-suave); }
    .tarjeta-enlace a.abrir {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 600;
      color: white;
      background-color: var(--color-acento-teal);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 20px;
    }
    .tarjeta-sugerencia-ia {
      background: var(--color-fondo);
      border: 1px solid var(--color-borde);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .tarjeta-sugerencia-ia .titulo-sugerencia { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
    .tarjeta-sugerencia-ia .detalle-sugerencia { font-size: 13px; color: var(--color-texto-suave); margin-bottom: 4px; }
    .tarjeta-sugerencia-ia .consejo { font-size: 12px; color: var(--color-acento-teal); font-weight: 600; }
    h3.categoria-ia {
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      margin: 18px 0 8px;
    }
    h3.categoria-ia:first-of-type { margin-top: 12px; }
  </style>

</head>
<body>

  <div class="logo-tripmus">Tripmus<span class="punto">.</span></div>
  <a class="volver" href="tripmus-viajes.html">&larr; Volver a viajes</a>

  <h1 id="titulo-viaje">Cargando viaje...</h1>
  <p class="subtitulo" id="subtitulo-viaje"></p>

  <div class="caja-anadir" id="caja-ia">
    <h2 class="grupo-tipo" style="margin-top:0;">✨ Sugerencias de IA para este viaje</h2>
    <p style="font-size:13px; color: var(--color-texto-suave); margin: 0 0 10px;">
      Vuelos, alojamiento y actividades orientativos según destino y fechas. No son precios en tiempo real.
    </p>
    <input type="text" id="origen-ia" placeholder="Tu ciudad de origen (ej: Cracovia)">
    <button id="pedir-sugerencias">Pedir sugerencias del viaje</button>
    <p id="mensaje-ia" style="font-size:13px; color: var(--color-texto-suave); margin: 8px 0 0;"></p>
    <div id="resultado-ia"></div>
  </div>

  <div class="caja-anadir">
    <select id="tipo-enlace">
      <option value="vuelo">✈️ Vuelo</option>
      <option value="alojamiento">🛏️ Alojamiento</option>
      <option value="actividad">🎟️ Actividad</option>
      <option value="otro">🔗 Otro</option>
    </select>
    <input type="text" id="titulo-enlace" placeholder="Título (ej: Vuelo Cracovia-Oslo, Ryanair)">
    <input type="text" id="url-enlace" placeholder="Enlace (https://...)">
    <input type="text" id="anadido-por" placeholder="Tu nombre">
    <button id="anadir-enlace">Añadir enlace</button>
  </div>

  <p id="mensaje-estado"></p>

  <div id="lista-enlaces"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://jhowamfmrrhxphhijgsn.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impob3dhbWZtcnJoeHBoaGlqZ3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzI3ODcsImV4cCI6MjEwMzc0ODc4N30.EwJi9JrniY3SpQPSl-JtnnwSLxCzMIpMQHLN4P7PUhE";
    const cliente = supabase.createClient(supabaseUrl, supabaseKey);

    // ---------- LEER PARÁMETROS DE LA URL ----------
    // Cuando entras aquí desde "Ver viajes", la URL tiene esta forma:
    // tripmus-viaje-detalle.html?viaje=abc123&grupo=demo
    // URLSearchParams nos deja leer esa parte de la URL como si fuera
    // un pequeño diccionario, sin tener que trocear el texto a mano.
    const parametros = new URLSearchParams(window.location.search);
    const viajeId = parametros.get("viaje");
    const grupo = parametros.get("grupo");

    const etiquetasTipo = {
      vuelo: "✈️ Vuelo",
      alojamiento: "🛏️ Alojamiento",
      actividad: "🎟️ Actividad",
      otro: "🔗 Otro"
    };

    if (!viajeId) {
      document.getElementById("titulo-viaje").textContent = "No se ha indicado ningún viaje";
      document.getElementById("subtitulo-viaje").textContent = "Vuelve a la lista de viajes y entra desde una tarjeta.";
    } else {
      cargarViaje();
      cargarEnlaces();
    }

    // ---------- SUGERENCIAS DE VUELOS CON IA ----------
    // Esta es la URL de tu Edge Function. El nombre "rapid-action" es el que
    // le puso Supabase por defecto al desplegarla; el código sigue siendo el mismo.
    const urlFuncionIA = "https://jhowamfmrrhxphhijgsn.supabase.co/functions/v1/rapid-action";

    let datosViaje = null; // aquí guardamos destino/fechas una vez cargados, para reutilizarlos

    document.getElementById("pedir-sugerencias").addEventListener("click", async function () {
      const origen = document.getElementById("origen-ia").value.trim();
      const mensajeIA = document.getElementById("mensaje-ia");
      const resultadoIA = document.getElementById("resultado-ia");

      if (!datosViaje) {
        mensajeIA.textContent = "Espera a que cargue la información del viaje.";
        return;
      }

      mensajeIA.textContent = "Pensando en opciones de vuelo...";
      resultadoIA.innerHTML = "";

      try {
        const respuesta = await fetch(urlFuncionIA, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            // La Edge Function tiene "Verify JWT" activado, y la clave anon
            // de Supabase cumple ese requisito, así que la mandamos aquí.
            "Authorization": "Bearer " + supabaseKey,
            "apikey": supabaseKey
          },
          body: JSON.stringify({
            destino: datosViaje.destino || "destino sin especificar",
            origen: origen,
            fechaInicio: datosViaje.fecha_inicio,
            fechaFin: datosViaje.fecha_fin
          })
        });

        const datos = await respuesta.json();

        if (datos.error) {
          mensajeIA.textContent = "Error de la IA: " + JSON.stringify(datos.error);
          console.error("Error de la IA:", datos.error);
          return;
        }

        mensajeIA.textContent = "Sugerencias orientativas, no son precios ni disponibilidad en tiempo real.";
        resultadoIA.innerHTML = "";

        // Función auxiliar para no repetir el mismo código 3 veces:
        // pinta una categoría entera (título + sus tarjetas) a partir
        // de una lista de sugerencias y una función que sabe cómo
        // convertir cada sugerencia concreta en HTML.
        function pintarCategoria(titulo, lista, construirTarjeta) {
          if (!lista || lista.length === 0) return;

          const encabezado = document.createElement("h3");
          encabezado.classList.add("categoria-ia");
          encabezado.textContent = titulo;
          resultadoIA.appendChild(encabezado);

          lista.forEach(function (item) {
            const tarjeta = document.createElement("div");
            tarjeta.classList.add("tarjeta-sugerencia-ia");
            tarjeta.innerHTML = construirTarjeta(item);
            resultadoIA.appendChild(tarjeta);
          });
        }

        pintarCategoria("✈️ Vuelos", datos.vuelos, function (v) {
          return '<div class="titulo-sugerencia">' + v.opcion + '</div>' +
            '<div class="detalle-sugerencia">' + v.ruta + '</div>' +
            '<div class="consejo">' + v.consejo + '</div>';
        });

        pintarCategoria("🛏️ Alojamiento", datos.alojamiento, function (a) {
          return '<div class="titulo-sugerencia">' + a.zona + '</div>' +
            '<div class="detalle-sugerencia">' + a.tipo + '</div>' +
            '<div class="consejo">' + a.consejo + '</div>';
        });

        pintarCategoria("🎟️ Actividades", datos.actividades, function (act) {
          return '<div class="titulo-sugerencia">' + act.nombre + '</div>' +
            '<div class="detalle-sugerencia">' + act.descripcion + '</div>' +
            '<div class="consejo">' + act.consejo + '</div>';
        });

        if (!datos.vuelos && !datos.alojamiento && !datos.actividades) {
          mensajeIA.textContent = "La IA no devolvió el formato esperado. Prueba otra vez.";
          console.error("Respuesta inesperada:", datos);
        }
      } catch (error) {
        console.error("Error llamando a la IA:", error);
        mensajeIA.textContent = "Error al pedir sugerencias. Revisa la consola (F12) para más detalle.";
      }
    });

    async function cargarViaje() {
      const resultado = await cliente
        .from("viajes")
        .select("nombre, destino, fecha_inicio, fecha_fin")
        .eq("id", viajeId)
        .maybeSingle();

      if (resultado.error || !resultado.data) {
        document.getElementById("titulo-viaje").textContent = "No se ha podido cargar el viaje";
        return;
      }

      const v = resultado.data;
      datosViaje = v; // guardamos para poder usarlos luego en la llamada a la IA
      document.getElementById("titulo-viaje").textContent = v.nombre;
      const fechas = (v.fecha_inicio && v.fecha_fin) ? v.fecha_inicio + " → " + v.fecha_fin : "Fechas por definir";
      document.getElementById("subtitulo-viaje").textContent = (v.destino || "Destino por definir") + " · " + fechas;
    }

    async function cargarEnlaces() {
      const resultado = await cliente
        .from("enlaces_viaje")
        .select("tipo, titulo, url, anadido_por")
        .eq("viaje_id", viajeId)
        .order("creado_en", { ascending: true });

      const contenedor = document.getElementById("lista-enlaces");
      contenedor.innerHTML = "";

      if (resultado.error) {
        console.error("Supabase error:", resultado.error.message);
        return;
      }

      if (resultado.data.length === 0) {
        contenedor.innerHTML = '<p style="font-size:14px; color: var(--color-texto-suave);">Todavía no hay enlaces guardados para este viaje.</p>';
        return;
      }

      // Agrupamos los enlaces por tipo (vuelo, alojamiento, actividad, otro)
      // para no mostrarlos todos mezclados sin orden.
      const grupos = { vuelo: [], alojamiento: [], actividad: [], otro: [] };
      resultado.data.forEach(function (e) {
        (grupos[e.tipo] || grupos.otro).push(e);
      });

      Object.keys(grupos).forEach(function (tipo) {
        if (grupos[tipo].length === 0) return;

        const encabezado = document.createElement("h2");
        encabezado.classList.add("grupo-tipo");
        encabezado.textContent = etiquetasTipo[tipo];
        contenedor.appendChild(encabezado);

        grupos[tipo].forEach(function (e) {
          const tarjeta = document.createElement("div");
          tarjeta.classList.add("tarjeta-enlace");
          tarjeta.innerHTML =
            '<div class="info">' +
            '<div class="titulo">' + e.titulo + '</div>' +
            '<div class="quien">' + (e.anadido_por ? "Añadido por " + e.anadido_por : "") + '</div>' +
            '</div>' +
            '<a class="abrir" href="' + e.url + '" target="_blank" rel="noopener">Abrir</a>';
          contenedor.appendChild(tarjeta);
        });
      });
    }

    document.getElementById("anadir-enlace").addEventListener("click", async function () {
      const tipo = document.getElementById("tipo-enlace").value;
      const titulo = document.getElementById("titulo-enlace").value.trim();
      const url = document.getElementById("url-enlace").value.trim();
      const anadidoPor = document.getElementById("anadido-por").value.trim();
      const mensaje = document.getElementById("mensaje-estado");

      if (titulo === "" || url === "") {
        alert("Escribe al menos el título y el enlace");
        return;
      }

      mensaje.textContent = "Guardando...";

      const resultado = await cliente.from("enlaces_viaje").insert({
        viaje_id: viajeId,
        tipo: tipo,
        titulo: titulo,
        url: url,
        anadido_por: anadidoPor === "" ? null : anadidoPor
      });

      if (resultado.error) {
        console.error("Supabase error:", resultado.error.message);
        mensaje.textContent = "Error al guardar: " + resultado.error.message;
        return;
      }

      mensaje.textContent = "Enlace añadido.";
      document.getElementById("titulo-enlace").value = "";
      document.getElementById("url-enlace").value = "";

      cargarEnlaces(); // recargamos la lista para que aparezca el nuevo enlace
    });
  </script>
</body>
</html>
