<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B45">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <title>Tripmus - Presupuesto</title>
  <style>
    :root {
      --color-fondo: #F7F3EC;
      --color-texto: #1E1B34;
      --color-texto-suave: #6b6880;
      --color-borde: #e6e0d4;
      --color-marca: #FF6B45;
      --color-acento-teal: #1FADA6;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--color-fondo);
      color: var(--color-texto);
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--color-borde);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-texto-suave);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .nav a.activo {
      background-color: var(--color-marca);
      color: white;
    }

    .logo-tripmus {
      display: flex;
      align-items: center;
      gap: 2px;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 22px;
      color: var(--color-texto);
      margin-bottom: 14px;
    }

    .logo-tripmus .punto {
      color: var(--color-marca);
      font-size: 26px;
      line-height: 0;
    }

    h1 {
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
    }

    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }

    .etiqueta-opcional {
      display: inline-block;
      font-size: 11px;
      color: var(--color-texto-suave);
      background: white;
      border: 1px solid var(--color-borde);
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    p.subtitulo {
      color: var(--color-texto-suave);
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 10px 12px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 12px;
      display: block;
      border: 1px solid var(--color-borde);
      border-radius: 12px;
      font-size: 14px;
      background: white;
    }

    .caja-slider {
      background: white;
      border: 1px solid var(--color-borde);
      border-radius: 10px;
      padding: 20px 16px;
      margin-bottom: 16px;
    }

    .fila-slider {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fila-slider input[type="range"] {
      flex: 1;
    }

    .fila-slider .valor {
      font-size: 16px;
      font-weight: 600;
      min-width: 56px;
      text-align: right;
    }

    button {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
      width: 100%;
      margin-bottom: 10px;
      border: none;
    }

    #guardar {
      background-color: var(--color-marca);
      color: white;
    }

    #omitir {
      background: white;
      color: var(--color-texto-suave);
      border: 1px solid var(--color-borde);
    }

    #mensaje-estado {
      font-size: 13px;
      color: var(--color-texto-suave);
      margin: 10px 0 24px;
    }

    .resumen-grupo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tarjeta-metrica {
      background: var(--color-fondo);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .tarjeta-metrica .etiqueta {
      font-size: 12px;
      color: var(--color-texto-suave);
      margin-bottom: 4px;
    }

    .tarjeta-metrica .numero {
      font-size: 22px;
      font-weight: 600;
    }
    button {
      transition: transform 0.08s ease, opacity 0.08s ease;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="logo-tripmus">Tripmus<span class="punto">.</span></div>

  <div class="nav">
    <a href="index.html">Mi disponibilidad</a>
    <a href="tripmus-grupo.html">Ver grupo</a>
    <a href="tripmus-presupuesto.html" class="activo">Presupuesto</a>
    <a href="tripmus-viajes.html">Viajes</a>
  </div>

  <span class="etiqueta-opcional">Opcional</span>
  <h1>Presupuesto</h1>
  <p class="subtitulo">Si quieres afinar las recomendaciones, indica tu máximo. Puedes saltarte este paso sin problema.</p>

  <input type="text" id="nombre" placeholder="Tu nombre">
  <p id="info-sesion" style="font-size: 12px; color: var(--color-texto-suave); margin-bottom: 12px;"></p>

  <div class="caja-slider">
    <div class="fila-slider">
      <input type="range" id="slider-presupuesto" min="50" max="400" step="10" value="180">
      <span class="valor" id="valor-presupuesto">180€</span>
    </div>
  </div>

  <button id="guardar">Guardar presupuesto</button>
  <button id="omitir">Omitir este paso</button>

  <p id="mensaje-estado"></p>

  <h2 style="font-size: 15px; margin-bottom: 10px;">Presupuesto del grupo</h2>
  <div class="resumen-grupo" id="resumen-grupo">
    <div class="tarjeta-metrica">
      <div class="etiqueta">Media</div>
      <div class="numero" id="media-grupo">—</div>
    </div>
    <div class="tarjeta-metrica">
      <div class="etiqueta">Rango</div>
      <div class="numero" id="rango-grupo">—</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://jhowamfmrrhxphhijgsn.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impob3dhbWZtcnJoeHBoaGlqZ3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzI3ODcsImV4cCI6MjEwMzc0ODc4N30.EwJi9JrniY3SpQPSl-JtnnwSLxCzMIpMQHLN4P7PUhE";
    function leerSesion() {
      try {
        const guardado = localStorage.getItem("tripmus_sesion");
        return guardado ? JSON.parse(guardado) : null;
      } catch (e) {
        return null;
      }
    }
    function guardarSesion(sesion) { localStorage.setItem("tripmus_sesion", JSON.stringify(sesion)); }
    function borrarSesion() { localStorage.removeItem("tripmus_sesion"); }

    const clienteBase = supabase.createClient(supabaseUrl, supabaseKey);
    let cliente = clienteBase;

    async function asegurarSesion(pedirNombre) {
      let sesion = leerSesion();
      if (!sesion || !sesion.grupo || !sesion.pin || (pedirNombre && !sesion.nombre)) {
        let grupo = (sesion && sesion.grupo) || "";
        while (!grupo) {
          grupo = prompt("Código de grupo (el mismo para todo tu equipo):");
          if (grupo === null) return null;
          grupo = grupo.trim();
        }
        const existeResp = await clienteBase.rpc("existe_grupo", { p_codigo: grupo });
        const existe = existeResp.data === true;
        let pin = "";
        let pinValido = false;
        while (!pinValido) {
          if (existe) {
            pin = prompt("Ese grupo ya existe. Introduce el PIN del grupo:");
            if (pin === null) return null;
            const comprobacion = await clienteBase.rpc("pin_valido", { p_codigo: grupo, p_pin: pin });
            pinValido = comprobacion.data === true;
            if (!pinValido) alert("PIN incorrecto. Pregunta a alguien de tu grupo o inténtalo de nuevo.");
          } else {
            pin = prompt("Grupo nuevo. Elige un PIN y compártelo con tu grupo:");
            if (pin === null) return null;
            const creado = await clienteBase.rpc("crear_grupo", { p_codigo: grupo, p_pin: pin });
            pinValido = creado.data === true;
            if (!pinValido) alert("Alguien acaba de crear ese grupo. Prueba con el PIN que os hayáis pasado.");
          }
        }
        let nombre = (sesion && sesion.nombre) || "";
        if (pedirNombre) nombre = prompt("Tu nombre:", nombre) || nombre;
        sesion = { nombre: nombre, grupo: grupo, pin: pin };
        guardarSesion(sesion);
      }
      cliente = supabase.createClient(supabaseUrl, supabaseKey, {
        global: { headers: { "x-grupo-pin": sesion.pin } }
      });
      return sesion;
    }

    function cambiarSesion() { borrarSesion(); location.reload(); }

    let sesionActual = null;

    const mensajeEstado = document.getElementById("mensaje-estado");
    const slider = document.getElementById("slider-presupuesto");
    const valorPresupuesto = document.getElementById("valor-presupuesto");

    // Cada vez que muevas el slider, actualizamos el número que se ve al lado.
    // El evento "input" se dispara mientras arrastras, no solo al soltar.
    slider.addEventListener("input", function () {
      valorPresupuesto.textContent = slider.value + "€";
    });

    document.getElementById("guardar").addEventListener("click", async function () {
      const nombre = document.getElementById("nombre").value.trim();

      if (nombre === "" || !sesionActual) {
        alert("Escribe tu nombre");
        return;
      }
      sesionActual.nombre = nombre;
      guardarSesion(sesionActual);

      mensajeEstado.textContent = "Guardando...";

      const resultado = await cliente
        .from("personas")
        .upsert(
          { nombre: nombre, grupo: sesionActual.grupo, presupuesto: Number(slider.value) },
          { onConflict: "nombre,grupo" }
        );

      if (resultado.error) {
        console.error("Supabase error:", resultado.error.message);
        mensajeEstado.textContent = "Error al guardar: " + resultado.error.message;
        return;
      }

      mensajeEstado.textContent = "Presupuesto guardado.";
      cargarResumenGrupo(sesionActual.grupo);
    });

    document.getElementById("omitir").addEventListener("click", function () {
      mensajeEstado.textContent = "Sin problema, puedes rellenarlo cuando quieras desde aquí.";
    });

    // ---------- RESUMEN DEL GRUPO ----------
    async function cargarResumenGrupo(grupo) {
      if (!grupo) return;

      const resultado = await cliente
        .from("personas")
        .select("presupuesto")
        .eq("grupo", grupo)
        .not("presupuesto", "is", null); // solo quienes SÍ han puesto presupuesto

      if (resultado.error || !resultado.data || resultado.data.length === 0) {
        document.getElementById("media-grupo").textContent = "—";
        document.getElementById("rango-grupo").textContent = "—";
        return;
      }

      const valores = resultado.data.map(function (p) { return p.presupuesto; });
      const media = Math.round(valores.reduce(function (a, b) { return a + b; }, 0) / valores.length);
      const minimo = Math.min(...valores);
      const maximo = Math.max(...valores);

      document.getElementById("media-grupo").textContent = media + "€";
      document.getElementById("rango-grupo").textContent = minimo + "–" + maximo + "€";
    }

    (async function iniciar() {
      const sesion = await asegurarSesion(true);
      if (!sesion) return;
      sesionActual = sesion;
      document.getElementById("nombre").value = sesion.nombre;
      document.getElementById("info-sesion").innerHTML =
        "Grupo: <strong>" + sesion.grupo + "</strong> · <a href=\"#\" onclick=\"cambiarSesion(); return false;\" style=\"color: var(--color-acento-teal);\">cambiar</a>";
      cargarResumenGrupo(sesion.grupo);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    }
  </script>
</body>
</html>
